name: Appointmo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test_and_build:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: appointmo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Run Shared Tests
        run: pnpm --filter @appointmo/shared test

      - name: Run API Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/appointmo_test
          JWT_SECRET: ci_test_secret_32_characters_minimum_sample
          NODE_ENV: test
        run: pnpm --filter @appointmo/api test

      - name: Build Web Application
        run: pnpm --filter @appointmo/web build

      - name: Build API Package
        run: pnpm --filter @appointmo/api build
